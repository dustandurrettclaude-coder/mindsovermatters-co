<!doctype html><html><head><meta charset="utf-8"><title>Buyer Consultation</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="_base.css"><style>:root{--accent:#1f3a5f}
.cl{display:grid;grid-template-columns:1fr 1fr;gap:2px 26px;margin-bottom:6px}
.cl div{display:flex;align-items:flex-start;gap:9px;font-size:9.3pt;line-height:1.5;padding:3.5px 0}
.cl i{flex:0 0 11px;height:11px;border:1.4px solid #8b93a4;border-radius:2px;margin-top:2px}
.cl1{grid-template-columns:1fr}
h2{font-size:10.5pt;text-transform:uppercase;letter-spacing:.07em;color:var(--accent);border-bottom:1px solid #d8dde6;padding-bottom:4px;margin:13px 0 7px}
h2:first-of-type{margin-top:0}
.field .box{height:0.34in}.field{margin-bottom:10px}</style></head><body>
<div class="sheet"><div class="brandbar"></div>
<h1>Buyer Consultation</h1><p class="sub">Ask these once, properly, and you stop showing the wrong houses.</p>
  <div class="hdr"><div class="left"><div class="ff"><label>Buyer name(s)</label><div class="rule"></div></div></div><div class="right"><div class="ff"><label>Date</label><div class="rule sm"></div></div></div></div>
  <div class="grid2">
    <div class="field"><label>Best phone / email</label><div class="box"></div></div>
    <div class="field"><label>Best time to reach you</label><div class="box"></div></div>
    <div class="field"><label>Current situation (renting, own, lease ends)</label><div class="box"></div></div>
    <div class="field"><label>Why move, and why now</label><div class="box"></div></div>
  </div>
  <h2>Money</h2>
  <div class="grid2">
    <div class="field"><label>Pre-approved? Lender name</label><div class="box"></div></div>
    <div class="field"><label>Comfortable monthly payment</label><div class="box"></div></div>
    <div class="field"><label>Funds available for down payment</label><div class="box"></div></div>
    <div class="field"><label>Any funds needed from a sale first?</label><div class="box"></div></div>
  </div>
  <h2>The house</h2>
  <div class="grid2">
    <div class="field"><label>Price range</label><div class="box"></div></div>
    <div class="field"><label>Areas / school zones</label><div class="box"></div></div>
    <div class="field"><label>Beds / baths minimum</label><div class="box"></div></div>
    <div class="field"><label>Must have</label><div class="box tall"></div></div>
    <div class="field"><label>Will not accept</label><div class="box tall"></div></div>
    <div class="field"><label>Timeline to be moved in</label><div class="box"></div></div>
  </div>
  <h2>Notes</h2>
  <div class="lines"><div></div><div></div></div>
  <div class="foot"><div class="sig"><div class="ff"><label>Client</label><div class="rule"></div></div><div class="ff"><label>Agent</label><div class="rule"></div></div><div class="ff"><label>Date</label><div class="rule sm"></div></div></div></div>
</div></body></html>
