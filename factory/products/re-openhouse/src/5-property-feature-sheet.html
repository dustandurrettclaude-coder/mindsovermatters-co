<!doctype html><html><head><meta charset="utf-8"><title>Property Feature Sheet</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="_base.css"><style>:root{--accent:#1f3a5f}
.photo{border:1px dashed #b3bbc9;border-radius:4px;height:3.05in;display:flex;align-items:center;justify-content:center;color:#96a0b2;font-size:9.5pt;letter-spacing:.09em;text-transform:uppercase;margin-bottom:16px;background:#fafbfc}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:11px;margin-bottom:16px}
.stat{border-top:2.5px solid var(--accent);padding-top:7px}
.stat b{display:block;font-size:15pt;line-height:1.15;border-bottom:1px solid #8b93a4;min-height:0.26in}
.stat span{font-size:8.2pt;color:#5a6172;letter-spacing:.055em;text-transform:uppercase}
.feat{display:grid;grid-template-columns:1fr 1fr;gap:0 30px}
.feat div{display:flex;align-items:baseline;gap:8px;height:0.33in}
.feat div::before{content:"";flex:0 0 5px;height:5px;background:var(--accent);border-radius:1px;transform:translateY(-3px)}
.feat div::after{content:"";flex:1 1 auto;border-bottom:1px solid #c9cfda;transform:translateY(-3px)}
.photo{height:2.75in}
</style></head><body>
<div class="sheet">
  <div class="brandbar"></div>
  <div class="ff" style="margin-bottom:9px"><label style="font-size:11pt">Property</label><div class="rule" style="height:0.3in"></div></div>
  <div class="hdr" style="border-bottom:none;padding-bottom:0;margin-bottom:14px">
    <div class="left"><div class="ff"><label>Address</label><div class="rule"></div></div></div>
    <div class="right"><div class="ff"><label>Offered at $</label><div class="rule sm"></div></div></div>
  </div>
  <div class="photo">Property photo</div>
  <div class="stats">
    <div class="stat"><b>&nbsp;</b><span>Bedrooms</span></div>
    <div class="stat"><b>&nbsp;</b><span>Bathrooms</span></div>
    <div class="stat"><b>&nbsp;</b><span>Square feet</span></div>
    <div class="stat"><b>&nbsp;</b><span>Year built</span></div>
  </div>
  <h2>Features</h2>
  <div class="feat"><div></div><div></div><div></div><div></div><div></div><div></div><div></div><div></div><div></div><div></div></div>
  <h2>Schools &amp; neighborhood</h2>
  <div class="lines"><div></div><div></div><div></div></div>
  <div class="foot"><div class="sig"><div class="ff"><label>Presented by</label><div class="rule"></div></div><div class="ff"><label>Phone</label><div class="rule"></div></div><div class="ff"><label>Email</label><div class="rule"></div></div></div></div>
</div>
</body></html>
